version: '3.8'

services:
  # Bitechez Local Restaurant PostgreSQL Server
  bitechez-local-db:
    image: postgres:16-alpine
    container_name: bitechez_local_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bitechez_local
    ports:
      - "5432:5432"
    volumes:
      - local_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Bitechez Cloud Platform PostgreSQL
  bitechez-cloud-db:
    image: postgres:16-alpine
    container_name: bitechez_cloud_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bitechez_cloud
    ports:
      - "5433:5432"
    volumes:
      - cloud_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  local_pg_data:
  cloud_pg_data:

